<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Frutas Cumbia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2d42;--paper:#fffaf0;--pink:#ffafcc;--yellow:#ffd166;--mint:#8ce99a;--lila:#c8b6ff;
  --blue:#a5d8ff;--orange:#ffc078;--beat:.625s;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:'Patrick Hand','Comic Sans MS',cursive;color:var(--ink);
  background:#1d1f33;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:radial-gradient(circle at 30% 30%,#34375a 0 2px,transparent 3px),radial-gradient(circle at 70% 70%,#2c2f4f 0 3px,transparent 4px);
  background-size:38px 38px,61px 61px;
}
button{font-family:inherit;color:inherit}
#phone{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--paper)}
#app{position:absolute;inset:0;overflow:hidden}
@media (min-width:620px){
  :root{--top:34px;--bot:10px}
  #phone{width:390px;height:min(844px,calc(100vh - 40px));border-radius:50px;border:12px solid #0d0d14;
    box-shadow:0 0 0 2px #4a4d6e,0 30px 80px rgba(0,0,0,.6)}
  #phone::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#0d0d14;border-radius:20px;z-index:60}
  #app{border-radius:38px}
}

/* ---------- fondo: cielo, mar, ballena ---------- */
#bg{position:absolute;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(#d0ebff 0%,#e7f5ff 38%,#fff9db 70%,#fff9db 100%)}
#bg::after{content:'';position:absolute;inset:0;opacity:.35;
  background-image:radial-gradient(#adb5bd 0.7px,transparent 1.2px);background-size:9px 9px}
.sun{position:absolute;top:calc(var(--top) + 30px);left:-14px;width:96px;animation:spin 30s linear infinite}
.cloud{position:absolute;width:110px;opacity:.95}
.cloud.c1{top:calc(var(--top) + 70px);animation:drift 38s linear infinite}
.cloud.c2{top:calc(var(--top) + 150px);width:80px;animation:drift 52s linear infinite -20s}
.sea{position:absolute;left:0;right:0;bottom:0;height:120px}
.sea svg{position:absolute;left:0;bottom:0;width:200%;height:120px;animation:waves 9s linear infinite}
.whale{position:absolute;bottom:22px;width:150px;animation:swim 28s linear infinite}
.whale svg{animation:bob 2.4s ease-in-out infinite}
.jelly{position:absolute;bottom:40px;right:14px;width:46px;animation:float 4s ease-in-out infinite}
.fish{position:absolute;bottom:70px;width:40px;animation:swimL 17s linear infinite -6s}
.bubble{position:absolute;bottom:-20px;width:14px;height:14px;border:2.5px solid #4dabf7;border-radius:50%;background:rgba(255,255,255,.5);animation:rise 7s linear infinite}

/* ---------- pantallas ---------- */
.screen{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  padding:calc(var(--top) + 62px) 18px calc(var(--bot) + 18px);
  opacity:0;pointer-events:none;transform:translateY(26px) scale(.98);
  transition:opacity .4s,transform .5s cubic-bezier(.2,.9,.3,1.35);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{opacity:1;pointer-events:auto;transform:none}

.box{background:#fff;border:3.5px solid var(--ink);border-radius:24px 28px 22px 30px/28px 22px 30px 24px;box-shadow:5px 6px 0 var(--ink)}
.btn{font-family:'Chewy',cursive;font-size:25px;letter-spacing:.5px;padding:13px 24px;cursor:pointer;
  border:3.5px solid var(--ink);border-radius:22px 28px 20px 30px/28px 20px 30px 22px;background:var(--yellow);
  box-shadow:4px 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.small{font-size:19px;padding:9px 16px}
.btn.pink{background:var(--pink)}.btn.mint{background:var(--mint)}.btn.lila{background:var(--lila)}.btn.blue{background:var(--blue)}

#topbar{position:absolute;z-index:20;top:calc(var(--top) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#topbar > *{pointer-events:auto}
.iconbtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);font-size:22px;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.iconbtn.hide{visibility:hidden}

/* ---------- inicio ---------- */
#s-home{align-items:center;text-align:center;justify-content:flex-start}
.title{font-family:'Chewy',cursive;font-size:62px;line-height:.92;margin:6px 0 4px;letter-spacing:1px}
.title .w{display:block}
.title span{display:inline-block;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink);
  animation:letter calc(var(--beat)*2) ease-in-out infinite}
.subtitle{font-size:22px;margin:10px 6px 0;padding:10px 16px;transform:rotate(-1.5deg);display:inline-flex;align-items:center;gap:10px;text-align:left;line-height:1.1}
.subtitle svg{flex:none;width:46px}
.trio{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:150px;margin:14px 0 6px}
.trio > div{width:118px}
.trio > div:nth-child(2){width:138px}
.dance{animation:cumbia calc(var(--beat)*2) ease-in-out infinite;transform-origin:50% 90%}
.dance.alt{animation-delay:calc(var(--beat)*-1)}
.tagline{font-size:18px;opacity:.8;margin:8px 0 16px}
.home-actions{display:flex;flex-direction:column;gap:14px;align-items:center;width:100%}
.home-actions .btn{width:82%}
.foot{font-size:14px;opacity:.6;margin-top:auto;padding-top:20px}

/* ---------- quiz ---------- */
#s-quiz{gap:14px}
.prog{display:flex;justify-content:center;gap:10px;margin-top:-4px}
.prog i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff;transition:.3s}
.prog i.done{background:var(--mint);transform:scale(.9)}
.prog i.now{background:var(--yellow);transform:scale(1.25);animation:pulse 1s ease-in-out infinite}
.qcard{position:relative;padding:30px 20px 22px;font-size:27px;line-height:1.12;margin-top:6px;transform:rotate(-.8deg)}
.qcard .tag{position:absolute;top:-17px;left:16px;font-family:'Chewy';font-size:17px;background:var(--lila);border:3px solid var(--ink);border-radius:14px;padding:3px 12px;transform:rotate(-3deg)}
.qcard .q-ico{position:absolute;right:-10px;top:-24px;width:56px;animation:float 3s ease-in-out infinite}
.qcard.enter{animation:cardIn .55s cubic-bezier(.2,.9,.3,1.4)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-size:21px;line-height:1.08;padding:11px 14px;cursor:pointer;
  border:3.5px solid var(--ink);border-radius:20px 26px 18px 28px/26px 18px 28px 20px;box-shadow:4px 5px 0 var(--ink);
  animation:popIn .45s cubic-bezier(.2,.9,.3,1.5) backwards;transition:transform .15s,opacity .25s,box-shadow .1s}
.opt:nth-child(1){background:#ffd6e5}.opt:nth-child(2){background:#fff3bf}.opt:nth-child(3){background:#d3f9d8}.opt:nth-child(4){background:#e5dbff}
.opt:nth-child(2){animation-delay:.07s}.opt:nth-child(3){animation-delay:.14s}.opt:nth-child(4){animation-delay:.21s}
.opt .let{flex:none;width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-family:'Chewy';font-size:21px}
.opt:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.opt.chosen{transform:scale(1.05) rotate(-1.5deg);animation:wiggle .5s}
.opt.faded{opacity:.3;transform:scale(.95)}
.react{position:absolute;left:50%;bottom:calc(var(--bot) + 22px);z-index:25;transform:translateX(-50%) scale(0);
  width:84%;padding:12px 16px;font-size:20px;text-align:center;background:var(--yellow);transition:transform .35s cubic-bezier(.2,.9,.3,1.6)}
.react.show{transform:translateX(-50%) scale(1) rotate(1deg)}
.react{cursor:pointer;line-height:1.15}
.react small{display:block;font-size:14px;opacity:.55;margin-top:5px}

/* ---------- pensando ---------- */
#s-think{align-items:center;justify-content:center;text-align:center}
.blender{position:relative;width:240px;height:240px}
.blender .orb{position:absolute;inset:0;animation:spin 2.4s linear infinite}
.blender .orb > div{position:absolute;width:74px;left:83px;top:0}
.blender .orb > div:nth-child(2){transform:rotate(120deg);transform-origin:37px 120px}
.blender .orb > div:nth-child(3){transform:rotate(240deg);transform-origin:37px 120px}
.blender .core{position:absolute;left:50%;top:50%;width:96px;transform:translate(-50%,-50%);animation:shake .4s infinite}
.think-msg{font-size:24px;margin-top:22px;padding:12px 18px;min-height:64px;display:flex;align-items:center;justify-content:center}

/* ---------- revelación ---------- */
#s-reveal{align-items:center;text-align:center;padding-top:calc(var(--top) + 54px)}
.stage{position:relative;width:100%;height:290px;flex:none;display:grid;place-items:center}
.rays{position:absolute;left:50%;top:50%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(255,212,59,.6) 0 9deg,rgba(255,255,255,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 25%,transparent 66%);mask:radial-gradient(circle,#000 25%,transparent 66%);
  opacity:0;transition:opacity .6s;animation:spin 14s linear infinite}
.hatched .rays{opacity:1}
.egg{position:absolute;width:190px;cursor:pointer;animation:eggIdle 1.6s ease-in-out infinite;transform-origin:50% 90%}
.egg.shake{animation:eggShake .45s}
.egg .crack{opacity:0;stroke-dasharray:220;stroke-dashoffset:220;transition:stroke-dashoffset .35s,opacity .1s}
.egg .crack.on{opacity:1;stroke-dashoffset:0}
.hatched .egg{animation:eggOut .5s forwards;pointer-events:none}
.tap-hint{position:absolute;bottom:-6px;font-family:'Chewy';font-size:21px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 14px;animation:pulse 1.1s infinite}
.hatched .tap-hint{display:none}
.flash{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border-radius:50%;background:#fff;opacity:0;pointer-events:none}
.hatched .flash{animation:flash .7s ease-out}
.fruit-big{position:relative;width:250px;opacity:0;transform:scale(0)}
.hatched .fruit-big{animation:fruitPop .9s .25s cubic-bezier(.2,.9,.3,1.5) forwards}
.fruit-big .inner{animation:cumbia calc(var(--beat)*2) ease-in-out infinite 1.3s;transform-origin:50% 90%}
.you-are{font-family:'Chewy';font-size:22px;margin:4px 0 0;opacity:0}
.you-are b{display:block;font-size:46px;line-height:1;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink);font-weight:normal}
.hatched .you-are{animation:stamp .6s .9s cubic-bezier(.2,.9,.3,1.6) forwards}
.reveal-rest{width:100%;opacity:0;transform:translateY(40px)}
.hatched .reveal-rest{animation:slideUp .7s 1.4s cubic-bezier(.2,.9,.3,1.2) forwards}

/* ---------- carta Frutadex ---------- */
.dexcard{margin:18px 0 6px;text-align:left;overflow:hidden;padding:0}
.dexcard .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:3px solid var(--ink);font-family:'Chewy';font-size:20px}
.dexcard .hd .hp{font-size:18px}
.dexcard .bd{padding:12px 14px 14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.badge{font-family:'Chewy';font-size:15px;border:2.5px solid var(--ink);border-radius:12px;padding:2px 10px}
.sci{font-style:italic;opacity:.75;font-size:17px;margin-bottom:10px}
.stat{display:grid;grid-template-columns:110px 1fr 22px;align-items:center;gap:8px;font-size:18px;margin:5px 0}
.bar{height:15px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.9,.3,1.1);border-right:2.5px solid var(--ink)}
.hatched .bar i,.filled .bar i{width:var(--w)}
.bar i.zero{border-right:none}
.verdict{display:flex;gap:10px;align-items:flex-start;margin:14px 0 10px}
.verdict svg{flex:none;width:52px}
.verdict .bub{position:relative;background:#fff9db;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:18.5px;line-height:1.15}
.verdict .bub::before{content:'';position:absolute;left:-11px;top:16px;border:8px solid transparent;border-right-color:var(--ink)}
.verdict .bub small{display:block;font-family:'Chewy';font-size:14px;opacity:.65;margin-bottom:2px}
.move{display:flex;justify-content:space-between;gap:8px;border-top:2.5px dashed var(--ink);padding-top:8px;margin-top:6px;font-size:18px}
.move b{font-family:'Chewy';font-weight:normal}
.reveal-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 0 8px}

/* ---------- frutadex ---------- */
#s-dex h2{font-family:'Chewy';font-weight:normal;font-size:38px;margin:0;text-align:center;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;color:var(--yellow);text-shadow:3px 3px 0 var(--ink)}
.dexcount{text-align:center;font-size:19px;margin:2px 0 14px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-bottom:12px}
.tile{padding:4px 3px 4px;text-align:center;font-size:13px;line-height:1;cursor:pointer;border-radius:16px 18px 14px 20px;box-shadow:3px 3px 0 var(--ink);border-width:3px}
.tile.locked{background:#e9ecef;cursor:default}
.tile .num{font-family:'Chewy';opacity:.6}
.tile .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

.modal{position:absolute;inset:0;z-index:40;background:rgba(43,45,66,.55);display:none;align-items:flex-start;justify-content:center;padding:calc(var(--top) + 60px) 16px 20px;overflow-y:auto}
.modal.open{display:flex}
.modal .sheet{width:100%;animation:cardIn .45s cubic-bezier(.2,.9,.3,1.4);text-align:center}
.modal .sheet .fr{width:170px;margin:0 auto -6px}

.toast{position:absolute;left:50%;top:calc(var(--top) + 66px);z-index:50;transform:translate(-50%,-140%);opacity:0;visibility:hidden;background:var(--mint);padding:8px 16px;font-size:19px;transition:transform .35s cubic-bezier(.2,.9,.3,1.5);white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#fx{position:absolute;inset:0;z-index:30;pointer-events:none;width:100%;height:100%}

/* ---------- caras ---------- */
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}

/* ---------- keyframes ---------- */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(520px)}}
@keyframes waves{to{transform:translateX(-50%)}}
@keyframes swim{0%{left:-170px;transform:none}48%{left:105%;transform:none}50%{left:105%;transform:scaleX(-1)}98%{left:-170px;transform:scaleX(-1)}100%{left:-170px;transform:none}}
@keyframes swimL{from{left:110%}to{left:-60px}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(-520px) translateX(20px);opacity:0}}
@keyframes letter{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(4deg)}}
@keyframes cumbia{0%{transform:rotate(-9deg) translateY(0)}25%{transform:rotate(0) translateY(-10px) scaleY(1.04)}50%{transform:rotate(9deg) translateY(0)}75%{transform:rotate(0) translateY(-10px) scaleY(1.04)}100%{transform:rotate(-9deg) translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes cardIn{0%{transform:translateY(50px) rotate(4deg) scale(.8);opacity:0}100%{opacity:1}}
@keyframes popIn{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{opacity:1}}
@keyframes wiggle{0%,100%{transform:scale(1.05) rotate(-1.5deg)}25%{transform:scale(1.1) rotate(3deg)}50%{transform:scale(1.05) rotate(-4deg)}75%{transform:scale(1.08) rotate(2deg)}}
@keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(0)}25%{transform:translate(-52%,-49%) rotate(-6deg)}75%{transform:translate(-48%,-51%) rotate(6deg)}}
@keyframes eggIdle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-6px)}}
@keyframes eggShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg) scale(1.05)}40%{transform:rotate(14deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(6deg)}}
@keyframes eggOut{to{transform:scale(1.6);opacity:0}}
@keyframes flash{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(22)}}
@keyframes fruitPop{0%{opacity:1;transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg);opacity:1}80%{transform:scale(.92) rotate(-3deg)}100%{transform:scale(1);opacity:1}}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-8deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
@keyframes slideUp{to{opacity:1;transform:none}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="phone"><div id="app">

<!-- filtros globales: trazo "a mano" -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <filter id="wobA" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence id="wobSeed" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="4.5"/></filter>
  </defs>
</svg>

<div id="bg">
  <svg class="sun" viewBox="0 0 100 100"><g filter="url(#wob)" stroke="#2b2d42" stroke-width="3" stroke-linecap="round">
    <g stroke="#f59f00" stroke-width="5"><line x1="50" y1="4" x2="50" y2="16"/><line x1="50" y1="84" x2="50" y2="96"/><line x1="4" y1="50" x2="16" y2="50"/><line x1="84" y1="50" x2="96" y2="50"/><line x1="17" y1="17" x2="26" y2="26"/><line x1="74" y1="74" x2="83" y2="83"/><line x1="83" y1="17" x2="74" y2="26"/><line x1="17" y1="83" x2="26" y2="74"/></g>
    <circle cx="50" cy="50" r="26" fill="#ffd43b"/></g></svg>
  <svg class="cloud c1" viewBox="0 0 120 60"><path filter="url(#wob)" d="M20 50 C5 50 5 30 20 30 C20 12 45 8 52 22 C60 6 88 8 88 28 C105 26 112 50 95 50 Z" fill="#fff" stroke="#2b2d42" stroke-width="3"/></svg>
  <svg class="cloud c2" viewBox="0 0 120 60"><path filter="url(#wob)" d="M20 50 C5 50 5 30 20 30 C20 12 45 8 52 22 C60 6 88 8 88 28 C105 26 112 50 95 50 Z" fill="#fff" stroke="#2b2d42" stroke-width="3"/></svg>
  <div class="sea">
    <svg viewBox="0 0 800 120" preserveAspectRatio="none"><path d="M0 30 Q50 10 100 30 T200 30 T300 30 T400 30 T500 30 T600 30 T700 30 T800 30 V120 H0Z" fill="#74c0fc" stroke="#2b2d42" stroke-width="3"/><path d="M0 62 Q50 46 100 62 T200 62 T300 62 T400 62 T500 62 T600 62 T700 62 T800 62 V120 H0Z" fill="#4dabf7" opacity=".7"/></svg>
    <div class="whale"><svg viewBox="0 0 170 100"><g filter="url(#wob)" stroke="#2b2d42" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M38 60 C24 54 12 42 6 30 C16 33 24 38 30 44 C28 32 32 22 40 16 C42 32 44 44 48 54 Z" fill="#5c9ded"/>
      <path d="M30 60 C30 32 80 22 115 30 C148 38 162 56 150 72 C138 88 70 90 46 80 C36 76 30 70 30 60 Z" fill="#5c9ded"/>
      <path d="M52 78 C80 86 132 84 146 72 C130 76 90 76 60 70 Z" fill="#d0ebff"/>
      <path d="M100 24 C98 14 94 8 88 6 M100 24 C102 12 108 6 114 6 M100 24 C100 14 100 8 100 2" fill="none" stroke="#4dabf7" stroke-width="3"/>
      <circle cx="128" cy="50" r="4.5" fill="#2b2d42" stroke="none"/><circle cx="129.5" cy="48.5" r="1.4" fill="#fff" stroke="none"/>
      <circle cx="137" cy="60" r="5" fill="#ff8fab" stroke="none" opacity=".7"/>
      <path d="M128 64 Q136 70 144 64" fill="none" stroke-width="3"/></g></svg></div>

/* =========================================================

   ========================================================= */
/* WAV silencioso: en iPhone, mantener un <audio> sonando hace que el sonido web
   se escuche aunque el interruptor de silencio esté activado */
function silentWav(){const n=4000,buf=new ArrayBuffer(44+n),v=new DataView(buf),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,"data");v.setUint32(40,n,true);
  for(let i=0;i<n;i++)v.setUint8(44+i,128);return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}))}
const IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const Sound={ctx:null,on:true,m:null,timer:null,next:0,step:0,primed:false,silent:null,
  init(){if(this.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;this.ctx=new AC();
    const comp=this.ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=4;comp.connect(this.ctx.destination);
    this.m=this.ctx.createGain();this.m.gain.value=this.on?.9:0;this.m.connect(comp)}catch(e){this.ctx=null}},
  resume(){try{if(this.ctx&&this.ctx.state!=="running")this.ctx.resume()}catch(e){}},
  /* se llama dentro de un toque del usuario */
  unlock(){if(!this.on){this.init();return}
    try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
    if(IS_IOS){try{if(!this.silent){this.silent=new Audio(silentWav());this.silent.loop=true;this.silent.setAttribute("playsinline","")}this.silent.play().catch(()=>{})}catch(e){}}
    this.init();this.resume();
    if(this.ctx&&!this.primed){try{const s=this.ctx.createBufferSource();s.buffer=this.ctx.createBuffer(1,1,22050);s.connect(this.ctx.destination);s.start(0);this.primed=true}catch(e){}}
    this.startLoop()},
  tone(f,d,type="sine",v=.2,t=0,f2){if(!this.ctx||!this.on)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain(),T=c.currentTime+t;
    o.type=type;o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);
    g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+.01);g.gain.exponentialRampToValueAtTime(.0008,T+d);o.connect(g);g.connect(this.m);o.start(T);o.stop(T+d+.05)},
  noise(d,v,T,fq=4000,q=1.2){const c=this.ctx;if(!this.nb){this.nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=this.nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
    const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();s.buffer=this.nb;bp.type="bandpass";bp.frequency.value=fq;bp.Q.value=q;
    g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+.008);g.gain.exponentialRampToValueAtTime(.0008,T+d);s.connect(bp);bp.connect(g);g.connect(this.m);s.start(T,Math.random()*.5);s.stop(T+d+.02)},
  tap(){this.tone(520,.09,"square",.08,0,880)},
  pop(){this.tone(400,.18,"triangle",.3,0,1000);this.tone(900,.1,"square",.06,.05,1400)},
  crack(){if(!this.ctx||!this.on)return;this.noise(.12,.6,this.ctx.currentTime,2200,.8);this.tone(260,.12,"square",.1,0,140)},
  fanfare(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.25,"square",.1,i*.09));[523,659,784].forEach(f=>this.tone(f,.9,"square",.05,.4));this.tone(1568,.6,"triangle",.12,.4)},
  startLoop(){if(!this.ctx||this.timer)return;this.next=this.ctx.currentTime+.08;this.step=0;
    this.timer=setInterval(()=>{if(!this.on||!this.ctx)return;const now=this.ctx.currentTime;if(this.next<now-.2)this.next=now+.05;
      while(this.next<now+.15){this.sched(this.step,this.next);this.next+=60/96/2;this.step++}},30)},
  stopLoop(){clearInterval(this.timer);this.timer=null},
  /* cumbia I–V7–V7–I a ~96 bpm, en registros que sí suenan en el parlante del móvil:
     bajo, güiro largo-corto, acordeón a contratiempo y una melodía de 8 compases */
  MEL:[[659,0,784,0,659,587,523,0],[587,0,698,0,587,523,494,0],[494,523,587,0,698,0,587,0],[523,0,659,0,523,0,0,0],
       [784,0,880,784,659,0,523,0],[698,0,784,698,587,0,494,0],[587,0,494,0,392,0,494,0],[523,0,0,0,523,0,659,0]],
  sched(st,T){const c=this.ctx,b=st%8,bar=Math.floor(st/8)%8,dom=bar%4===1||bar%4===2;
    const root=dom?196:261.63,fifth=dom?293.66:392,chord=dom?[493.88,587.33,698.46]:[523.25,659.25,783.99];
    const voice=(type,f,v,d,lp)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;let n=o;
      if(lp){const fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;o.connect(fl);n=fl}
      g.gain.setValueAtTime(0,T);g.gain.linearRampToValueAtTime(v,T+.012);g.gain.exponentialRampToValueAtTime(.0008,T+d);n.connect(g);g.connect(this.m);o.start(T);o.stop(T+d+.05)};
    if(b===0)voice("sawtooth",root,.2,.3,1000);
    if(b===4)voice("sawtooth",fifth,.2,.3,1000);
    if(b===6)voice("sawtooth",root,.13,.14,1000);
    if(b===0||b===4){const k=c.createOscillator(),g=c.createGain();k.frequency.setValueAtTime(160,T);k.frequency.exponentialRampToValueAtTime(50,T+.14);
      g.gain.setValueAtTime(.5,T);g.gain.exponentialRampToValueAtTime(.0008,T+.16);k.connect(g);g.connect(this.m);k.start(T);k.stop(T+.2)}
    this.noise(b%2?.05:.17,b%2?.24:.16,T,b%2?5200:3800,1.4);
    if(b%2)chord.forEach(fq=>voice("square",fq,.04,.12,2400));
    const note=this.MEL[bar][b];if(note){voice("square",note,.075,.24,2800);voice("triangle",note*2,.03,.18)}
  },
  toggle(){this.on=!this.on;try{localStorage.setItem("fc.sound",this.on?"1":"0")}catch(e){}
    if(this.on){this.unlock();if(this.m)this.m.gain.value=.9}else{this.stopLoop();if(this.m)this.m.gain.value=0;try{this.silent&&this.silent.pause()}catch(e){}}
    updSoundBtn()}
};

  const cr=e.querySelectorAll(".crack");if(cr[taps-1])cr[taps-1].classList.add("on");
  if(taps>=3)setTimeout(hatch,380)});
function hatch(){const R=$("#s-reveal");R.classList.add("hatched");Sound.fanfare();
  const st=$("#stage").getBoundingClientRect(),ap=$("#app").getBoundingClientRect();
  setTimeout(()=>confetti(st.left-ap.left+st.width/2,st.top-ap.top+st.height/2,[CUR.c1,CUR.c2,"#ffd43b","#ff8fab","#74c0fc","#8ce99a"]),250)}

/* =========================================================
   CONFETI
   ========================================================= */
const fx=$("#fx"),cx=fx.getContext("2d");let parts=[],raf=0;
function sizeFx(){const r=$("#app").getBoundingClientRect(),d=window.devicePixelRatio||1;fx.width=r.width*d;fx.height=r.height*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener("resize",sizeFx);sizeFx();
function confetti(x,y,cols){for(let i=0;i<170;i++){const a=Math.random()*Math.PI*2,sp=4+Math.random()*11;
  parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,r:4+Math.random()*6,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],s:i%3})}
  if(!raf)loop()}
function loop(){const H=fx.height/(window.devicePixelRatio||1),W=fx.width/(window.devicePixelRatio||1);cx.clearRect(0,0,W,H);
  parts.forEach(p=>{p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.strokeStyle=INK;cx.lineWidth=1.5;
    cx.beginPath();if(p.s===0)cx.rect(-p.r,-p.r/2,p.r*2,p.r);else if(p.s===1)cx.arc(0,0,p.r*.7,0,7);else{cx.moveTo(0,-p.r);cx.lineTo(p.r,p.r);cx.lineTo(-p.r,p.r);cx.closePath()}
    cx.fill();cx.stroke();cx.restore()});
  parts=parts.filter(p=>p.y<H+40);raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,W,H)}

/* =========================================================
   FRUTADEX
   ========================================================= */
function openDex(){const dex=getDex();$("#dexCount").textContent=`Has descubierto ${dex.size} de 50 frutas`;
  $("#grid").innerHTML=FRUITS.map(f=>{const ok=dex.has(f.id);return`<div class="tile box ${ok?"":"locked"}" data-id="${f.id}">${fruitSVG(f,{sil:!ok})}<span class="num">#${String(f.id).padStart(3,"0")}</span><span class="nm">${ok?f.n:"???"}</span></div>`}).join("");
  show("s-dex")}
$("#grid").addEventListener("click",e=>{const t=e.target.closest(".tile");if(!t||t.classList.contains("locked"))return;const f=FRUITS[t.dataset.id-1];Sound.tap();
  $("#sheet").innerHTML=`<div class="fr dance">${fruitSVG(f)}</div><div class="filled">${cardHTML(f)}</div><button class="btn small" id="closeM">Cerrar</button>`;$("#modal").classList.add("open")});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"||e.target.id==="closeM")$("#modal").classList.remove("open")});

/* =========================================================
   BOTONES
   ========================================================= */
$("#btnPlay").onclick=startGame;
$("#btnAgain").onclick=startGame;
$("#btnDex").onclick=()=>{Sound.tap();openDex()};
$("#btnDex2").onclick=()=>{Sound.tap();openDex()};
$("#btnHome").onclick=()=>{Sound.tap();clearInterval(wobT);show("s-home")};
$("#btnSound").onclick=()=>Sound.toggle();
$("#btnShare").onclick=async()=>{if(!CUR)return;const dom=DIMS[dominant(CUR.p)];
  const txt=`🎶 FRUTAS CUMBIA 🎶\nSegún Fernando Cañamero soy ${art(CUR)} ${CUR.n.toUpperCase()} (${RAR[CUR.r].t}, tipo ${dom.t}).\n“${CUR.v}”\n¿Y tú qué fruta eres?`;
  try{if(navigator.share){await navigator.share({title:"Frutas Cumbia",text:txt});return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(txt);toast("¡Copiado! Pégalo donde quieras 📋")}catch(e){toast("No pude copiar 😅")}};
updSoundBtn();renderHome();
</script>
