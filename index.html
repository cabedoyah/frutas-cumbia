<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Lab Cumbia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2d42;--muted:#6c6f86;--paper:#fffaf0;--pink:#ffafcc;--yellow:#ffd166;--mint:#8ce99a;--lila:#c8b6ff;--blue:#a5d8ff;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--beat:.625s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Patrick Hand','Comic Sans MS',cursive;color:var(--ink);background:#1d1f33;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:radial-gradient(circle at 30% 30%,#34375a 0 2px,transparent 3px),radial-gradient(circle at 70% 70%,#2c2f4f 0 3px,transparent 4px);background-size:38px 38px,61px 61px}
button{font-family:inherit;color:inherit}
#phone{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:var(--paper)}
#app{position:absolute;inset:0;overflow:hidden;background:var(--paper);background-image:radial-gradient(#dee2e6 .7px,transparent 1.2px);background-size:9px 9px}
@media (min-width:620px){:root{--top:34px;--bot:10px}
  #phone{width:390px;height:min(844px,calc(100vh - 40px));border-radius:50px;border:12px solid #0d0d14;box-shadow:0 0 0 2px #4a4d6e,0 30px 80px rgba(0,0,0,.6)}
  #phone::before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:30px;background:#0d0d14;border-radius:20px;z-index:60}
  #app{border-radius:38px}}

.box{background:#fff;border:3px solid var(--ink);border-radius:22px 26px 20px 28px/26px 20px 28px 22px;box-shadow:4px 5px 0 var(--ink)}
.btn{font-family:'Chewy',cursive;font-size:21px;padding:10px 18px;cursor:pointer;border:3px solid var(--ink);border-radius:18px 24px 16px 26px/24px 16px 26px 18px;background:var(--yellow);box-shadow:3px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45}
.btn.small{font-size:17px;padding:7px 13px}.btn.ghost{background:#fff}.btn.mint{background:var(--mint)}.btn.pink{background:var(--pink)}
.note{color:var(--muted);font-size:16px;text-align:center}
#topbar{position:absolute;z-index:30;top:calc(var(--top) + 10px);left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}
#topbar>*{pointer-events:auto}
.iconbtn{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:3px 4px 0 var(--ink);font-size:21px;display:grid;place-items:center;cursor:pointer;padding:0}
.iconbtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.iconbtn.hide{visibility:hidden}

.screen{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:calc(var(--top) + 64px) 16px calc(var(--bot) + 20px);
  opacity:0;pointer-events:none;transform:translateY(22px);transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.3);overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.active{opacity:1;pointer-events:auto;transform:none}
.h-title{font-family:'Chewy';font-size:34px;margin:0 0 8px;text-align:center;color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}

/* HUD */
.hud{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;margin-bottom:12px}
.hud-face{width:46px;height:46px;flex:none;border-radius:50%;background:#e7f5ff;border:2.5px solid var(--ink);overflow:hidden}
.hud-face svg{width:100%;height:100%}
.hud-main{flex:1;min-width:0;line-height:1.05}.hud-main b{font-family:'Chewy';font-weight:normal;font-size:19px}.hud-main small{display:block;color:var(--muted);font-size:14px}
.xpbar{height:9px;border:2px solid var(--ink);border-radius:8px;background:#fff;margin-top:3px;overflow:hidden}.xpbar i{display:block;height:100%;background:#4dabf7}
.hud-coins{font-family:'Chewy';font-size:19px;white-space:nowrap}

/* INICIO */
#s-hub{padding-top:calc(var(--top) + 10px)}
.lab-title{font-family:'Chewy';font-size:44px;line-height:1;text-align:center;margin:0 56px 2px;white-space:nowrap}
.lab-title span{display:inline-block;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink);animation:letter calc(var(--beat)*2) ease-in-out infinite}
.lab-sub{text-align:center;font-size:18px;color:var(--muted);margin:0 0 8px}
.hub-stage{position:relative;height:262px;flex:none;margin:0 0 6px}
.fer{position:absolute;left:12%;bottom:0;width:132px;cursor:pointer;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.fer.jump{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}.fer.spin{animation:spinj .7s ease-in-out}
.hub-me{position:absolute;right:10%;bottom:0;width:104px;animation:bob 2.4s ease-in-out infinite -1.2s}
.bubble{position:absolute;left:6px;right:6px;top:0;padding:8px 12px;font-size:18px;line-height:1.15;text-align:center;z-index:2}
.bubble::after{content:'';position:absolute;left:30%;bottom:-14px;border:9px solid transparent;border-top-color:var(--ink)}
.bubble.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.6)}
.deco{position:absolute;font-size:24px;animation:float 3s ease-in-out infinite;pointer-events:none}
.d1{left:2%;bottom:40px}.d2{right:2%;bottom:120px;animation-delay:-1s}.d3{left:48%;bottom:150px;animation-delay:-2s}.d4{right:36%;bottom:4px;animation-delay:-.5s}
#hubMenu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:10px 12px;cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:18px 22px 16px 24px;box-shadow:4px 5px 0 var(--ink);line-height:1.05}
.card:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.card .ci{font-size:28px}.card b{font-family:'Chewy';font-weight:normal;font-size:21px;margin-top:2px}.card small{color:var(--muted);font-size:14.5px;margin-top:2px}
.card.big{grid-column:1/-1;background:var(--yellow);flex-direction:row;align-items:center;gap:12px;flex-wrap:wrap}
.card.big .ci{font-size:40px}.card.big b{font-size:28px}.card.big small{flex-basis:100%;color:var(--ink);opacity:.75;font-size:16px}
.card[data-go="mini"]{background:#d3f9d8}.card[data-go="ach"]{background:#fff3bf}.card[data-go="bag"]{background:#e7f5ff}.card[data-go="char"]{background:#f3d9fa}

/* SELECCIÓN */
.sel-intro{text-align:center;font-size:18px;margin:-4px 0 6px}
.sel-h{font-family:'Chewy';font-weight:normal;font-size:22px;margin:14px 0 8px}
.sel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
.sel-c{background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);padding:6px 3px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:120px;margin-top:6px}
.sel-c svg{width:100%}.sel-c b{font-size:15px;font-weight:normal;margin-top:-2px}
.sel-c.on{background:var(--yellow)}
.sel-c:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.sel-big{width:130px;margin:-6px auto 0}.sel-tag{text-align:center;margin:0 0 8px;color:var(--muted)}
.sel-lab{display:block;font-size:16px;margin-bottom:8px}.sel-lab input{display:block;width:100%;font:inherit;font-size:20px;padding:7px 12px;border:3px solid var(--ink);border-radius:12px;margin-top:3px}
.stat{display:grid;grid-template-columns:96px 1fr 20px;gap:8px;align-items:center;font-size:16px;margin:4px 0}
.sbar{height:12px;border:2.5px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}.sbar i{display:block;height:100%;background:#69db7c}
.sel-sp{margin:8px 0 4px;font-size:17px}

/* MAPA */
#floorTabs{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.ftab{font-family:'Chewy';font-size:17px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:5px 14px;cursor:pointer}
.ftab.on{background:var(--ink);color:#fff}
#mapWrap{padding:6px;transition:opacity .25s}#mapWrap.fade{opacity:0}
.mapsvg{display:block;width:100%}
.mapsvg .room:active rect{opacity:.7}
.mapsvg .mark{animation:bounce 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.objs{margin-top:14px;padding:12px 14px}
.objs h3{font-family:'Chewy';font-weight:normal;font-size:21px;margin:0 0 6px}
.obj{display:grid;grid-template-columns:26px 1fr auto;gap:6px;align-items:start;padding:7px 0;border-top:1.5px dashed #ced4da;cursor:pointer;line-height:1.1}
.obj:first-of-type{border-top:none}
.obj span{font-size:18px}.obj b{font-size:17px;font-weight:normal;font-family:'Chewy'}.obj small{display:block;color:var(--muted);font-size:14.5px}
.obj em{font-style:normal;font-size:13px;white-space:nowrap;color:var(--muted)}
.obj.done{opacity:.5}.obj.done b{text-decoration:line-through}.obj.wait{opacity:.6}

/* SALA */
.room-name{font-family:'Chewy';font-size:28px;text-align:center;margin:0 0 8px}
.scene-wrap{position:relative;padding:0;overflow:hidden}
.scenesvg{display:block;width:100%;height:auto}
#roomNpcs{position:absolute;left:4px;right:4px;bottom:2px;display:flex;justify-content:center;align-items:flex-end;gap:0}
.npc{flex:0 1 54px;width:54px;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative}
.npc svg{width:100%;display:block}
.npc span{font-size:11px;background:#fff;border:1.5px solid var(--ink);border-radius:8px;padding:0 4px;margin-top:-4px;white-space:nowrap;max-width:62px;overflow:hidden;text-overflow:ellipsis}
.npc.trio{flex-basis:210px;width:210px}
.npc:only-child:not(.trio){flex-basis:84px;width:84px}
.npc:active{transform:scale(.94)}
.npc.hint{animation:hint .9s 3}
.trio-chars{display:flex;align-items:flex-end}.trio-chars>div{flex:1}
#roomActs{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.act{text-align:left;font-size:19px;background:var(--yellow)}.act small{display:block;font-family:'Patrick Hand';font-size:15px;opacity:.8}

/* MINIJUEGOS / LOGROS / MOCHILA */
#miniList{display:flex;flex-direction:column;gap:12px}
.mcard{display:flex;gap:12px;align-items:center;text-align:left;padding:10px 12px;cursor:pointer;line-height:1.1}
.mcard .mimg{flex:none;width:78px;display:grid;place-items:center}.mcard .mimg.big{font-size:30px}
.mcard b{font-family:'Chewy';font-weight:normal;font-size:21px;display:block}.mcard small{color:var(--muted);font-size:15px;display:block}.mcard em{font-style:normal;font-size:14px;display:block;margin-top:3px}
.mcard.soon{opacity:.55;cursor:default}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge-c{text-align:center;background:#f1f3f5;border:3px solid var(--ink);border-radius:14px;padding:6px 4px;line-height:1.05;opacity:.6}
.badge-c.on{background:var(--yellow);opacity:1}.badge-c span{font-size:30px;display:block}.badge-c b{font-size:13px;font-weight:normal;display:block}.badge-c small{font-size:11px;color:var(--muted)}
.ach{display:grid;grid-template-columns:36px 1fr auto;gap:8px;align-items:center;padding:8px 10px;margin:6px 0;background:#f8f9fa;border:2.5px solid #ced4da;border-radius:14px;line-height:1.1}
.ach.on{background:#fff;border-color:var(--ink)}.ach span{font-size:24px;text-align:center}.ach b{font-family:'Chewy';font-weight:normal;font-size:18px}.ach small{display:block;color:var(--muted);font-size:14.5px}.ach em{font-style:normal;font-size:14px}
.bag-me{display:flex;gap:10px;align-items:center;padding:10px}.bag-c{width:90px;flex:none}.bag-me p{margin:6px 0 0;font-size:16px}

/* DIÁLOGO, MODAL, TOAST */
.dlg{position:absolute;inset:0;z-index:45;display:none;align-items:flex-end;background:rgba(43,45,66,.18);padding:0 10px calc(var(--bot) + 14px)}
.dlg.open{display:flex}
.dlg-box{width:100%;display:flex;gap:10px;align-items:flex-start;background:#fff;border:3.5px solid var(--ink);border-radius:20px;box-shadow:4px 5px 0 var(--ink);padding:10px 12px;animation:pop .3s cubic-bezier(.2,.9,.3,1.5)}
#dlgFace{flex:none;width:62px;height:62px;border-radius:50%;background:#e7f5ff;border:2.5px solid var(--ink);overflow:hidden;display:grid;place-items:center}
#dlgFace svg{width:100%;height:100%}#dlgFace .trio-chars{width:100%}
.dlg-body{flex:1;min-width:0}#dlgName{font-family:'Chewy';font-weight:normal;font-size:18px}
#dlgText{margin:2px 0 4px;font-size:19px;line-height:1.18;min-height:44px}
.dlg-ch{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.dlg-next{font-size:14px;color:var(--muted);animation:pulse 1.2s infinite}
.modal{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(43,45,66,.55);padding:20px 16px;overflow-y:auto}
.modal.open{display:flex}
#modalBox{width:100%;max-height:100%;overflow-y:auto;padding:16px;animation:pop .35s cubic-bezier(.2,.9,.3,1.5)}
.rw-title{font-family:'Chewy';font-size:26px;text-align:center;line-height:1.05}
.rw-list{margin:12px 0 4px;font-size:20px;line-height:1.5;text-align:center}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:12px}
.ch-num{text-align:center;font-family:'Chewy';font-size:16px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.ch-intro{font-size:19px;line-height:1.2;text-align:center}
.shop-head{display:flex;gap:10px;align-items:center;margin-bottom:6px}.shop-head svg{width:62px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:#fff4e6}
.shop-head small{font-size:15px;color:var(--muted)}.shop-head .rw-title{text-align:left;font-size:22px}
.shop-row{display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1.5px dashed #ced4da;line-height:1.1}
.shop-row .se{font-size:30px}.shop-row b{font-family:'Chewy';font-weight:normal;font-size:19px}.shop-row small{display:block;color:var(--muted);font-size:14px}
.toast{position:absolute;left:50%;top:calc(var(--top) + 62px);z-index:50;transform:translate(-50%,-150%);opacity:0;visibility:hidden;background:var(--mint);padding:8px 14px;font-size:17px;line-height:1.15;transition:transform .35s cubic-bezier(.2,.9,.3,1.5);width:max-content;max-width:88%;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#fx{position:absolute;inset:0;z-index:55;pointer-events:none;width:100%;height:100%}

/* JUEGOS */
.game{position:absolute;inset:0;z-index:35;display:none;background:var(--paper);background-image:radial-gradient(#dee2e6 .7px,transparent 1.2px);background-size:9px 9px;overflow-y:auto;padding:calc(var(--top) + 60px) 14px calc(var(--bot) + 16px)}
.game.open{display:block;animation:pop .3s}
.g-title{font-family:'Chewy';font-weight:normal;font-size:28px;text-align:center;margin:0}
.g-sub{text-align:center;color:var(--muted);margin:2px 0 8px;font-size:16px}
.g-msg{padding:10px 12px;font-size:19px;text-align:center;min-height:50px;margin:10px 0}
.g-end{margin-top:12px;padding:12px;text-align:center;font-size:19px}.g-end .btn{margin-top:8px}
.rps-arena{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px}
.rps-side{text-align:center}.rps-ch{width:86px;margin:0 auto}.rps-side b{font-size:16px;font-weight:normal}
.hand{font-size:54px;line-height:1.1;margin-top:2px}.hand.opp{transform:scaleX(-1)}
.hand.shk{animation:handShake .32s}
.rps-score{font-family:'Chewy';font-size:38px;align-self:center}.rps-score small{margin:0 4px;color:var(--muted)}
.rps-btns{display:flex;gap:10px;justify-content:center}
.rps-b{flex:1;display:flex;flex-direction:column;align-items:center;font-size:17px}.rps-b span{font-size:36px}
.ftime{position:relative;height:22px;border:3px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;margin:6px 0}
.ftime i{display:block;height:100%;width:100%;background:#69db7c;transition:width .1s linear}.ftime span{position:absolute;inset:0;text-align:center;font-family:'Chewy';font-size:15px;line-height:17px}
.ftargets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.ftg{font-size:14.5px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 7px}.ftg.ok{background:var(--mint);text-decoration:line-through}
.farea{position:relative;height:340px;overflow:hidden;padding:0}
.farea .scenesvg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.fitems{position:absolute;inset:6px}
.fitem{position:absolute;background:none;border:0;padding:2px;cursor:pointer;line-height:1;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.25))}
.fitem.got{animation:got .5s forwards;pointer-events:none}.fitem.nope{animation:nope .35s}
.flash-light{position:absolute;inset:0;pointer-events:none;--x:50%;--y:50%;background:radial-gradient(circle at var(--x) var(--y),transparent 55px,rgba(10,10,25,.94) 95px)}
.bt-field{display:flex;flex-direction:column;gap:6px}
.bt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.bt-info{flex:1;padding:7px 10px;line-height:1.05;align-self:center}.bt-info b{font-family:'Chewy';font-weight:normal;font-size:18px}.bt-info small{display:block;color:var(--muted);font-size:13px}
.bt-info span{font-size:13px;color:var(--muted)}
.hpbar{height:12px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:4px 0 1px}.hpbar i{display:block;height:100%;width:100%;background:#51cf66;transition:width .5s}.hpbar i.low{background:#fa5252}
.bt-sprite{position:relative;width:110px;flex:none}.bt-sprite.trio{width:190px}.bt-sprite>svg,.bt-sprite .trio-chars{position:relative;z-index:1}
.plat{position:absolute;left:5%;right:5%;bottom:-6px;height:18px;border-radius:50%;background:#d8f5a2;border:2.5px solid var(--ink);z-index:0}
.bt-sprite.lunge{animation:lunge .4s}.bt-sprite.me.lunge{animation:lungeMe .4s}.bt-sprite.hit{animation:hit .45s}.bt-sprite.glow{animation:glow .8s}
.dmg{position:absolute;left:50%;top:20%;z-index:3;font-family:'Chewy';font-size:30px;color:#e03131;-webkit-text-stroke:1.5px #fff;paint-order:stroke fill;animation:dmgUp .9s forwards}
.dmg.crit{font-size:40px;color:#f76707}.dmg.heal{color:#2b8a3e}
.bt-msg{padding:10px 12px;font-size:19px;line-height:1.18;min-height:64px;margin:12px 0 10px;cursor:pointer}
.bt-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mv{font-size:16px;padding:8px 6px;line-height:1.05;background:#fff}.mv small{display:block;font-family:'Patrick Hand';font-size:13px;opacity:.7}
.mv.sp{background:var(--pink)}.mv.bag{background:var(--blue)}.mv.run{background:#f1f3f5}
.bt-menu>.btn:only-child{grid-column:1/-1}
.end-c{width:150px;margin:0 auto}.end-t{font-family:'Chewy';font-weight:normal;font-size:32px;text-align:center;margin:4px 0;line-height:1.05}
#s-end{text-align:center;align-items:center}#s-end p{font-size:19px}

.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
.bubbling{animation:bob 1s ease-in-out infinite}
@keyframes letter{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-40px) scale(.95,1.08)}60%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
@keyframes spinj{0%{transform:rotate(0)}50%{transform:translateY(-30px) rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes handShake{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes got{0%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.8)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
@keyframes nope{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}
@keyframes lunge{0%,100%{transform:none}40%{transform:translate(-26px,20px)}}
@keyframes lungeMe{0%,100%{transform:none}40%{transform:translate(26px,-20px)}}
@keyframes hit{0%,100%{transform:none;filter:none}20%{transform:translateX(-8px);filter:brightness(2)}40%{transform:translateX(8px)}60%{transform:translateX(-5px);filter:brightness(2)}80%{transform:translateX(4px)}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 12px #ffd43b) brightness(1.2)}}
@keyframes dmgUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.2);opacity:1}100%{transform:translate(-50%,-50px);opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="phone"><div id="app">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
  <filter id="wobA" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</defs></svg>

<div id="topbar"><button class="iconbtn hide" id="btnBack" aria-label="Volver">←</button><button class="iconbtn" id="btnSound" aria-label="Sonido">🔊</button></div>

<section class="screen active" id="s-hub">
  <h1 class="lab-title" id="labTitle" aria-label="Lab Cumbia"></h1>
  <p class="lab-sub">La vida secreta de los becarios</p>
  <div class="hud-slot"></div>
  <div class="hub-stage" id="hubStage"></div>
  <div id="hubMenu"></div>
</section>

<section class="screen" id="s-select">
  <h2 class="h-title">¿Quién eres?</h2>
  <p class="sel-intro">Elige tu personaje y escribe tu nombre. Cada uno tiene sus fortalezas.</p>
  <div id="selList"></div>
</section>

<section class="screen" id="s-map">
  <div class="hud-slot"></div>
  <div id="floorTabs"><button class="ftab" data-f="1">⬆️ Planta 1</button><button class="ftab" data-f="0">⬇️ Planta baja</button></div>
  <div class="box" id="mapWrap"></div>
  <p class="note" style="margin:6px 0 0">Toca una sala para ir. ❗ = misión disponible</p>
  <div class="objs box" id="objList"></div>
</section>

<section class="screen" id="s-room">
  <h2 class="room-name" id="roomName"></h2>
  <div class="scene-wrap box"><div id="roomScene"></div><div id="roomNpcs"></div></div>
  <div id="roomActs"></div>
</section>

<section class="screen" id="s-mini"><h2 class="h-title">Minijuegos</h2><div id="miniList"></div></section>
<section class="screen" id="s-ach"><h2 class="h-title">Logros</h2><div id="achList"></div></section>
<section class="screen" id="s-bag"><h2 class="h-title">Mochila</h2><div id="bagList"></div></section>
<section class="screen" id="s-end"><div id="endBox"></div></section>

<div class="game" id="game"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="dlg" id="dlg"><div class="dlg-box"><div id="dlgFace"></div><div class="dlg-body"><b id="dlgName"></b><p id="dlgText"></p><div class="dlg-ch" id="dlgCh"></div></div></div></div>
<div class="toast box" id="toast"></div>
<canvas id="fx"></canvas>
</div></div>

<script src="data.js"></script>
<script src="draw.js"></script>
<script src="js/sound.js"></script>
<script src="js/chars.js"></script>
<script src="js/world.js"></script>
<script src="js/story.js"></script>
<script src="js/games.js"></script>
<script>
(function(){const C=["#ff6b6b","#ffd43b","#69db7c","#4dabf7","#da77f2","#ff922b"],t="Lab Cumbia";
  document.getElementById("labTitle").innerHTML=[...t].map((ch,i)=>ch===" "?"<span style=\"width:.3em\"></span>":`<span style="color:${C[i%C.length]};animation-delay:${-i*.12}s">${ch}</span>`).join("")})();
</script>
<script src="js/app.js"></script>
</body>
</html>
